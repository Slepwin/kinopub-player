<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>KinoPub Player</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ======================= MPC-style menu bar ======================= -->
  <div id="menubar">
    <div class="menu-root" data-menu="file">Файл</div>
    <div class="menu-root" data-menu="view">Вид</div>
    <div class="menu-root" data-menu="play">Воспроизведение</div>
    <div class="menu-root" data-menu="navigate">Навигация</div>
    <div class="menu-root" data-menu="favorites">Избранное</div>
    <div class="menu-root" data-menu="help">Справка</div>
  </div>

  <!-- ======================= main area ======================= -->
  <div id="main">
    <!-- Library (browser) -->
    <div id="library">
      <div id="library-toolbar">
        <button id="btn-back" class="tb-btn" title="Назад (Backspace)">
          <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <button id="btn-home" class="tb-btn" title="Главное меню">
          <svg viewBox="0 0 16 16"><path d="M2 8 8 2l6 6M4 7v6h3v-3h2v3h3V7" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <div id="breadcrumb"></div>
        <input id="quick-search" type="text" placeholder="Поиск…" />
      </div>
      <div id="library-body">
        <div id="sidebar"></div>
        <div id="content"></div>
      </div>
    </div>

    <!-- Player -->
    <div id="player" class="hidden">
      <video id="video"></video>
      <div id="osd" class="hidden"></div>
      <div id="player-overlay-title" class="hidden"></div>
    </div>
  </div>

  <!-- ======================= MPC-style bottom chrome ======================= -->
  <div id="bottombar">
    <div id="seekrow">
      <div id="seekbar">
        <div id="seek-buffered"></div>
        <div id="seek-progress"></div>
        <div id="seek-thumb"></div>
      </div>
    </div>
    <div id="controls">
      <button class="pbtn" id="c-play" title="Воспроизведение (Space)">
        <svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>
      </button>
      <button class="pbtn" id="c-pause" title="Пауза (Space)">
        <svg viewBox="0 0 16 16"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>
      </button>
      <button class="pbtn" id="c-stop" title="Стоп">
        <svg viewBox="0 0 16 16"><path d="M3.5 3.5h9v9h-9z"/></svg>
      </button>
      <span class="sep"></span>
      <button class="pbtn" id="c-prev" title="Предыдущий эпизод">
        <svg viewBox="0 0 16 16"><path d="M4 3h2v10H4zM13 3v10L6.8 8z"/></svg>
      </button>
      <button class="pbtn" id="c-rew" title="-10 сек (←)">
        <svg viewBox="0 0 16 16"><path d="M8.5 3v10L2.5 8zM14 3v10L8 8z"/></svg>
      </button>
      <button class="pbtn" id="c-fwd" title="+10 сек (→)">
        <svg viewBox="0 0 16 16"><path d="M1.5 3v10L7.5 8zM7 3v10L13 8z"/></svg>
      </button>
      <button class="pbtn" id="c-next" title="Следующий эпизод">
        <svg viewBox="0 0 16 16"><path d="M10 3h2v10h-2zM3 3v10L9.2 8z"/></svg>
      </button>
      <span class="sep"></span>
      <button class="pbtn" id="c-audio" title="Аудиодорожка">
        <svg viewBox="0 0 16 16"><path d="M2 6h2l3-3v10L4 10H2zM10 5a4 4 0 0 1 0 6M12 3a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M2 6h2l3-3v10L4 10H2z"/></svg>
      </button>
      <button class="pbtn" id="c-subs" title="Субтитры">
        <svg viewBox="0 0 16 16"><rect x="1.5" y="3.5" width="13" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M3.5 8h4M9 8h3.5M3.5 10.5h2.5M7.5 10.5h5" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="pbtn" id="c-quality" title="Качество">HD</button>
      <button class="pbtn" id="c-full" title="Во весь экран (F)">
        <svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <span class="flex-fill"></span>
      <span id="time-display">00:00:00 / 00:00:00</span>
      <span class="sep"></span>
      <button class="pbtn" id="c-mute" title="Без звука (M)">
        <svg viewBox="0 0 16 16"><path d="M2 6h2l3-3v10L4 10H2z"/><path d="M10 5a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <input type="range" id="volume" min="0" max="100" value="100" title="Громкость" />
    </div>
    <div id="statusbar">
      <span id="status-text">Готово</span>
      <span class="flex-fill"></span>
      <span id="status-media"></span>
    </div>
  </div>

  <!-- ======================= dialogs / popups ======================= -->
  <div id="dim" class="hidden"></div>
  <div id="dialog-host"></div>
  <div id="ctx-menu" class="hidden"></div>
  <div id="toast-host"></div>

  <script src="vendor/hls.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
